# =============================================================================
# Global path planning.
# =============================================================================

/**/global_planner:
  ros__parameters:
    map_topic: "/arb/map"
    goal_topic: "/arb/goal"
    path_topic: "/arb/global_path"
    metrics_topic: "/arb/planner_metrics"
    map_frame: "map"
    base_frame: "base_link"

    # --- heuristic ---
    # "octile" | "euclidean" | "manhattan" | "dijkstra"
    #
    # Octile is the TIGHT admissible heuristic for an 8-connected grid:
    #   (sqrt(2) - 1) * min(dx, dy) + max(dx, dy)
    # which is exactly the true cost on an empty grid, so A* expands almost
    # nothing there.
    #
    # Euclidean is admissible but looser, so it expands more for the same
    # answer. Manhattan is INADMISSIBLE with diagonal moves -- it claims 2d for
    # a pure diagonal whose true cost is 1.41d -- and A* with it returns paths
    # that are plausible and not shortest. Measured over an 18-instance sweep:
    # suboptimal on 10 of them, worst case 8.9 % longer than necessary.
    heuristic: "octile"

    # 1.0 is admissible. Above it, weighted A* returns a path at most `weight`
    # times optimal and gets there faster -- a trade worth making explicit
    # rather than hiding inside the heuristic choice.
    heuristic_weight: 1.0

    # --- costmap ---
    lethal_threshold: 65

    # Unknown cells are impassable. Treating them as free lets the planner
    # route confidently through space it has never observed; treating them as
    # lethal stops it leaving the region it has mapped. Neither is right in
    # general, which is why this is a parameter.
    unknown_is_lethal: true

    # Obstacles are grown by the robot's radius so the planner can treat the
    # robot as a POINT. Planning for a point in an inflated world is exactly
    # equivalent to planning for a disc in the real one, and far cheaper than
    # checking a footprint at every cell.
    #
    # The robot's circumscribed radius is half the chassis diagonal,
    # sqrt(0.40^2 + 0.30^2)/2 = 0.25 m; 0.28 m adds 3 cm of margin. The
    # narrowest doorway in the world is 0.90 m wide, which leaves 0.34 m of
    # free corridor through it -- tight, and deliberately so.
    inflation_radius_m: 0.28

    # Beyond the lethal band, a decaying cost that keeps paths in the middle of
    # a corridor. Without it the shortest path hugs every wall, which leaves
    # the local planner no room and turns any control error into a collision.
    cost_decay_radius_m: 0.55
    cost_scaling: 12.0
    max_soft_cost: 2.5

    allow_diagonal: true
    max_expansions: 2000000

    replan_period_s: 1.0
    goal_tolerance_m: 0.25

/**/local_planner:
  ros__parameters:
    path_topic: "/arb/global_path"
    scan_topic: "/arb/scan"
    odom_topic: "/arb/odom"
    cmd_topic: "/cmd_vel"
    map_frame: "map"
    base_frame: "base_link"
    control_rate_hz: 20.0

    # --- actuator limits, mirroring configs/robot.yaml ---
    max_linear_velocity: 0.70
    min_linear_velocity: -0.30
    max_angular_velocity: 2.00
    max_linear_acceleration: 1.00
    max_angular_acceleration: 3.00

    # --- the velocity sampling grid ---
    # DWA searches VELOCITIES, not positions, so every candidate is by
    # construction something the robot can actually do. The window is what it
    # can reach within ONE control period given its acceleration limits.
    linear_samples: 9
    angular_samples: 21

    # The horizon is the most consequential parameter: too short and the robot
    # cannot see a wall in time, too long and it refuses perfectly safe motion
    # because something might be in the way eventually.
    simulation_time: 2.0
    simulation_dt: 0.1

    # --- objective weights ---
    # Three terms that pull in different directions, which is the design.
    # Heading alone drives into walls. Clearance alone parks in the middle of
    # the largest open space and never leaves. Velocity alone drives flat out
    # into the first thing it meets.
    heading_weight: 1.0
    clearance_weight: 0.7
    velocity_weight: 0.25
    path_weight: 1.2

    # The path term scores the distance to a CARROT a fixed arc length along
    # the path, not to the nearest path point. The path starts at the robot, so
    # "stay near the path" is maximised by not moving -- measured, and the
    # best-scoring command was the slowest one available, every cycle.
    path_lookahead_m: 1.0

    # --- safety ---
    robot_radius: 0.25
    max_useful_clearance: 1.2
    collision_margin: 0.02

    # The admissible-velocity condition: v <= sqrt(2 * dist * a_max).
    # The robot may choose any speed it can still STOP from before the first
    # obstacle on that curvature. This is NOT the same as requiring a clear
    # horizon, which makes a robot with 0.45 m of room at 0.3 m/s find no
    # admissible command and stop dead.
    enforce_stopping_distance: true

    # The safety check steps by DISTANCE, not time, so its resolution does not
    # depend on speed. Stepping by time at 0.66 m/s and 0.1 s jumps 6.6 cm
    # between checks; measured, that reported 0.265 m of room where there was
    # 0.20 m.
    collision_check_step_m: 0.02

    in_place_rotation_speed: 0.05

    # Obstacles come straight from the scan, not the map: the map is at best
    # two seconds old and cannot contain anything that has just walked in
    # front of the robot, which is the entire point of a local planner.
    obstacle_range_m: 3.0
    obstacle_stride: 3
    goal_tolerance_m: 0.20
