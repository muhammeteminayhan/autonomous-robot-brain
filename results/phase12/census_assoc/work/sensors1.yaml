/**/imu_preprocessor:
  ros__parameters:
    rate_hz: 200.0
    input_topic: /imu/data_raw
    output_topic: /arb/imu
    gyro:
      noise_density: 0.00035
      bias_stability: 0.0002
      bias_correlation_time_s: 300.0
      bias_random_walk: 2.0e-05
      scale_error: 0.002
    accel:
      noise_density: 0.0035
      bias_stability: 0.005
      bias_correlation_time_s: 300.0
      bias_random_walk: 0.0004
      scale_error: 0.003
    input_carries_nominal_noise: true
    calibration_samples: 200
    max_dt_s: 0.5
    seed: 1001
    fault:
      noise_scale: 1.0
      accel_noise_scale: 1.0
      gyro_bias_offset: 0.0
      outage: false
/**/encoder_preprocessor:
  ros__parameters:
    rate_hz: 50.0
    input_topic: /joint_states
    output_topic: /arb/wheel_states
    left_joint: left_wheel_joint
    right_joint: right_wheel_joint
    counts_per_revolution: 1024
    quadrature_multiplier: 4
    velocity_noise_sigma: 0.01
    slip_ratio_mean: 0.0
    slip_ratio_sigma: 0.01
    max_dt_s: 0.5
    seed: 1002
    fault:
      left_bias_rad_s: 0.0
      right_bias_rad_s: 0.0
      noise_scale: 1.0
      outage: false
/**/lidar_preprocessor:
  ros__parameters:
    rate_hz: 10.0
    input_topic: /scan_raw
    output_topic: /arb/scan
    range_noise_sigma: 0.015
    input_carries_nominal_noise: true
    dropout_probability: 0.0
    despeckle: true
    despeckle_max_obliquity_deg: 85.0
    despeckle_floor_m: 0.05
    seed: 1003
    fault:
      dropout_ratio: 0.0
      noise_scale: 1.0
      burst_mode: false
      burst_active: false
      outage: false
