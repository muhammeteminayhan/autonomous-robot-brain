# CASE B -- the gyro becomes 10x noisier, e.g. severe vibration or a failing
# MEMS element. Tests whether the EKF correctly DOWN-weights the IMU by
# widening R_imu, instead of blindly trusting it.
# RECOVERY WINDOW
# Every fault clears 25 s before the scenario ends. The first version ran each
# fault to the last second, which made "recovery time" -- one of the three
# numbers this phase exists to report -- unmeasurable for four of the six
# cases: there was no post-fault interval in which to measure anything. The
# degraded phase is unchanged in character; only its tail was trimmed.

scenario:
  id: "case_b_imu_high_noise"
  description: "Gyroscope noise inflated 10x from t = 20 s onwards."
  duration_s: 120.0
  faults:
    - type: "imu_high_noise"
      onset_s: 20.0
      duration_s: 75.0
      params:
        noise_scale: 10.0
        affect_accelerometer: true
