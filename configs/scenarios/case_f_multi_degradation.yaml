# CASE F -- simultaneous degradation. Individually survivable faults can
# compound: encoder drift removes the odometry reference at the same moment
# IMU noise removes the heading reference. This is the worst case and the one
# worth discussing in an interview.
# RECOVERY WINDOW
# Every fault clears 25 s before the scenario ends. The first version ran each
# fault to the last second, which made "recovery time" -- one of the three
# numbers this phase exists to report -- unmeasurable for four of the six
# cases: there was no post-fault interval in which to measure anything. The
# degraded phase is unchanged in character; only its tail was trimmed.

scenario:
  id: "case_f_multi_degradation"
  description: "Encoder drift + 5x IMU noise + 30 % LiDAR dropout, overlapping."
  duration_s: 120.0
  faults:
    - type: "encoder_drift"
      onset_s: 20.0
      duration_s: 75.0
      params: { wheel: "left", bias_rad_s: 0.04, ramp_time_s: 5.0 }
    - type: "imu_high_noise"
      onset_s: 40.0
      duration_s: 45.0
      params: { noise_scale: 5.0, affect_accelerometer: false }
    - type: "lidar_dropout"
      onset_s: 50.0
      duration_s: 45.0
      params: { dropout_ratio: 0.30, burst_mode: false }
